<!DOCTYPE html>
<!-- StoragePro - payments.html
     Payments: take a payment, print the receipt, follow up on overdue accounts -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payments · StoragePro</title>
  <!-- Fonts (Google Fonts) and icons (Font Awesome) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <!-- All the site's styles, and the tab icon -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="images/logo.svg">
</head>
<body>
<div class="app">
  <!-- Sidebar and top bar (added by js/layout.js) -->
  <aside id="sidebar"></aside>
  <div class="main">
    <header id="topbar"></header>
    <!-- Page content (drawn by js/payments.js) -->
    <main class="content" id="page"></main>
  </div>
</div>
<!-- Scripts, in this order:
     supabase-config.js   the database's address and key
     store.js             all the data and the rules for changing it (reads the database as the page opens)
     layout.js            sidebar, top bar, messages and shared helpers
     payments.js          draws this page
     app.js               dark mode, sidebar collapse, print button and keyboard shortcuts -->
<script src="js/supabase-config.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script src="js/payments.js"></script>
<script src="js/app.js"></script>
</body>
</html>
